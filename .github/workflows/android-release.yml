name: Publish verified owner-signed APKs
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version with committed public signature patches (without v)
        required: true
        type: string
      run_id:
        description: Successful APK workflow run ID
        required: true
        type: string
      run_number:
        description: APK workflow run number
        required: true
        type: string
      commit:
        description: Full source commit of the APK build
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      APK_RUN_ID: ${{ inputs.run_id }}
      APK_RUN_NUMBER: ${{ inputs.run_number }}
      APK_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate release identifiers
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$ ]]
          [[ "$APK_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$APK_RUN_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$APK_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test -f "packaging/releases/$RELEASE_VERSION/BUILD.json"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path('packaging/releases', os.environ['RELEASE_VERSION'], 'BUILD.json').read_text())
          assert metadata['version'] == os.environ['RELEASE_VERSION']
          assert metadata['commit'] == os.environ['APK_COMMIT']
          PYCODE
      - name: Download the exact original build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$APK_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts
      - name: Restore and verify offline signatures
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install 'build-tools;35.0.0' >/dev/null
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            apk="dist/Pojav-Rust-$RELEASE_VERSION-$abi.apk"
            python3 tools/apk_signature_patch.py apply \
              "artifacts/pojav-rust-$APK_RUN_NUMBER-$abi/Pojav-Rust-$APK_RUN_NUMBER-${APK_COMMIT:0:12}-$abi.apk" \
              "packaging/releases/$RELEASE_VERSION/$abi.json" "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "dist/$abi-signature.txt"
            python3 tools/check_android_release.py "$apk" --public --app-id dev.taldoshawn.pojav \
              --aapt2 "$ANDROID_HOME/build-tools/35.0.0/aapt2" --report "dist/$abi-audit.json"
          done
          cp "packaging/releases/$RELEASE_VERSION/BUILD.json" "packaging/releases/$RELEASE_VERSION/SHA256SUMS.txt" LICENSE THIRD_PARTY_NOTICES.md dist/
          if test -f "packaging/releases/$RELEASE_VERSION/VALIDATION.json"; then
            cp "packaging/releases/$RELEASE_VERSION/VALIDATION.json" dist/
          fi
          (cd dist && sha256sum --check SHA256SUMS.txt)
      - name: Package documentation and original examples with provenance
        run: python3 tools/package_android_docs.py --output dist --source-commit "$APK_COMMIT"
      - name: Attach actual emulator UI captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json, os, re
          from pathlib import Path
          record = json.loads(Path('packaging/releases', os.environ['RELEASE_VERSION'], 'VALIDATION.json').read_text())
          match = re.fullmatch(r'https://github.com/taldoshawn/pojav/actions/runs/([0-9]+)', record['workflow'])
          assert match
          Path('smoke-run-id.txt').write_text(match.group(1))
          PYCODE
          read -r smoke_run_id < smoke-run-id.txt || true
          gh run download "$smoke_run_id" --repo "$GITHUB_REPOSITORY" --name android-startup-evidence --dir evidence
          python3 - <<'PYCODE'
          from pathlib import Path
          import json, os, zipfile
          result = json.loads(Path('evidence/RESULT.json').read_text())
          assert result['failure'] is None and result['startup_passed']
          assert os.environ['APK_COMMIT'][:12] in result['apk']
          with zipfile.ZipFile('dist/Pojav-Rust-Capturas-do-APK.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for page in ('play', 'mods', 'resource-packs', 'shaders', 'installed', 'settings'):
                  image = Path('evidence', f'ui-{page}.png')
                  assert image.is_file()
                  archive.write(image, image.name)
              archive.write('evidence/RESULT.json', 'RESULT.json')
          PYCODE
      - name: Upload only verified public files to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" dist/*

  nivora_arm64:
    if: inputs.version == '0.1.0-alpha.4' && github.ref == 'refs/heads/codex/nivora-final'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Restore pinned signed APK without private key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43792112653 --repo "$GITHUB_REPOSITORY" --dir artifacts
          mkdir dist
          python3 tools/apk_signature_patch.py apply artifacts/pojav-rust-40-arm64-v8a/Nivora-Launcher-40-bf20d8eab6fc-arm64-v8a.apk packaging/releases/0.1.0-alpha.4/arm64-v8a.json dist/Nivora-Launcher-0.1.0-alpha.4-arm64-v8a.apk
          cp packaging/releases/0.1.0-alpha.4/{BUILD.json,SHA256SUMS.txt,arm64-v8a-signature.txt,arm64-v8a-audit.json} dist/
          cd dist
          sha256sum -c SHA256SUMS.txt
      - name: Verify Android signature and publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/*.apk
          gh release create v0.1.0-alpha.4 dist/* --repo "$GITHUB_REPOSITORY" --target bf20d8eab6fc04407e24a91fa35de75974de2c0b --title 'NIVORA LAUNCHER 0.1.0-alpha.4 — ARM64' --notes-file packaging/releases/0.1.0-alpha.4/NOTES.md --prerelease
