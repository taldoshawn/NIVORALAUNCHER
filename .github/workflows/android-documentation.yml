name: Android documentation and examples
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Android APK]
    types: [completed]
permissions:
  contents: read
jobs:
  documentation:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Package developer documentation and original examples
        run: python3 tools/package_android_docs.py --output dist --source-commit "${{ github.event.workflow_run.head_sha || github.sha }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pojav-rust-documentation-and-examples
          path: dist/
          if-no-files-found: error
          retention-days: 30
