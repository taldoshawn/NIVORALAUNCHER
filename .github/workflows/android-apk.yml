name: Android APK
run-name: NIVORA LAUNCHER APK · ${{ github.sha }}

on:
  push:
    branches: [main, codex/private-hud-peripherals]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      private_test:
        description: Build an isolated test app with repository signing; no release publication
        type: boolean
        default: false
      all_abis:
        description: Build ARM64, ARMv7, x86 and x86_64
        type: boolean
        default: true
      universal:
        description: Also assemble one APK with all four architectures (Android 9+)
        type: boolean
        default: false
      universal_source_run_id:
        description: Optional existing run with four successful architecture builds; only rerun universal packaging
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/private-hud-peripherals' || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || inputs.universal_source_run_id == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON((github.event_name == 'push' || inputs.all_abis || inputs.universal) && '["arm64-v8a","armeabi-v7a","x86","x86_64"]' || '["arm64-v8a"]') }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/ci-target
      HORIZON_TELEMETRY_URL: 'off'
      HORIZON_VERIFY_OFFICIAL_SIGNER: '1'
      NIVORA_PRIVATE_TEST: ${{ inputs.private_test && '1' || '0' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reserve build space on the disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc /usr/local/.ghcup
          if (( $(awk '/MemTotal/ {print $2}' /proc/meminfo) < 12000000 )); then
            sudo fallocate -l 8G /mnt/pojav-build.swap
            sudo chmod 600 /mnt/pojav-build.swap
            sudo mkswap /mnt/pojav-build.swap
            sudo swapon /mnt/pojav-build.swap
          fi
          df -h .
          free -h
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.14'
      - name: Install Android and Rust toolchains
        env:
          ABI: ${{ matrix.abi }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup show
          case "$ABI" in
            arm64-v8a) target=aarch64-linux-android ;;
            armeabi-v7a) target=armv7-linux-androideabi ;;
            x86) target=i686-linux-android ;;
            x86_64) target=x86_64-linux-android ;;
          esac
          rustup target add "$target"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/ci-target
          key: pojav-android-${{ matrix.abi }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            pojav-android-${{ matrix.abi }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Test protocol and packaging boundaries
        run: |
          python3 tools/check_public_tree.py
          python3 -m unittest discover -s tests -p 'test_android_release_audit.py'
          python3 -m unittest discover -s tests -p 'test_android_universal.py'
          python3 -m unittest discover -s tests -p 'test_nivora_single_launcher.py'
          cargo test -p horizon-protocol --lib --test legacy18 --locked
          cargo test -p horizon-world legacy_network_states --lib --locked
          cargo build -p horizon-protocol --example legacy_server_probe --locked
          python3 tools/legacy_test_server.py --probe "$CARGO_TARGET_DIR/debug/examples/legacy_server_probe"
          python3 tools/test_android_updater.py
          rustc --edition=2024 --test crates/horizon-client/src/android/local_profiles.rs -o /tmp/pojav-local-profile-tests
          /tmp/pojav-local-profile-tests
          rustc --edition=2024 --test crates/horizon-client/src/android/fps_hud.rs -o /tmp/pojav-fps-hud-tests
          /tmp/pojav-fps-hud-tests
          rustc --edition=2024 --test crates/horizon-client/src/android/content_storage.rs -o /tmp/pojav-content-storage-tests
          /tmp/pojav-content-storage-tests
      - name: Prepare verified private engine inputs
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME_25_X64"
      - name: Resolve all protocol 47 block states against the packaged registry
        run: |
          HORIZON_LEGACY_FACTS="$GITHUB_WORKSPACE/.local/horizon-client/26.3/facts.json" \
            cargo test -p horizon-protocol --test legacy_registry --locked -- --ignored
      - name: Verify touch controls on the host
        if: matrix.abi == 'arm64-v8a'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev libudev-dev
          CARGO_PROFILE_TEST_DEBUG=0 cargo test -p horizon-client-render --lib touch::custom::tests --locked
          CARGO_PROFILE_TEST_DEBUG=0 cargo test -p horizon-client-render --lib touch::property_input::tests --locked
          CARGO_PROFILE_TEST_DEBUG=0 cargo test -p horizon-client-render --lib touch::pojav::tests --locked
          CARGO_PROFILE_TEST_DEBUG=0 cargo test -p horizon-client --test hud_editor --test pojav_import --test legacy_rules --locked
          CARGO_PROFILE_TEST_DEBUG=0 cargo test -p horizon-client --example legacy_login_probe --locked
      - name: Restore this fork's signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          present = [bool(os.environ.get(k)) for k in ('KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS')]
          if not any(present) and os.environ.get('NIVORA_PRIVATE_TEST') == '1':
              raise SystemExit('Signed private test requires the repository signing secrets')
          if not any(present):
              print('No repository signing key: build uses an ephemeral development certificate.')
              raise SystemExit(0)
          if not all(present):
              raise SystemExit('Repository Android signing secrets are incomplete')
          path = Path('.local/android/ci.keystore').resolve()
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          values = {'HORIZON_ANDROID_KEYSTORE': str(path),
                    'HORIZON_ANDROID_KEYSTORE_PASSWORD': os.environ['KEYSTORE_PASSWORD'],
                    'HORIZON_ANDROID_KEY_PASSWORD': os.environ['KEYSTORE_PASSWORD'],
                    'HORIZON_ANDROID_KEY_ALIAS': os.environ['KEY_ALIAS']}
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in values.items():
                  output.write(f'{key}={value}\n')
          PY
      - name: Build and audit the optimized APK
        env:
          ABI: ${{ matrix.abi }}
        run: |
          app_id=dev.taldoshawn.pojav
          if [[ "$NIVORA_PRIVATE_TEST" == 1 ]]; then app_id=dev.taldoshawn.nivora.private; fi
          universal_args=()
          # Pushes on this branch automatically assemble one universal APK.
          # workflow_dispatch inputs are absent on push events, so testing only
          # inputs.universal previously gave 32-bit APKs minSdk 27 while 64-bit
          # APKs used minSdk 28. That changes AndroidManifest.xml and classes.dex,
          # which must be identical across all APKs assembled into one package.
          if [[ "${{ inputs.universal }}" == 'true' ]] || \
             [[ "${{ github.event_name }}" == 'push' && "${{ github.ref }}" == 'refs/heads/codex/private-hud-peripherals' ]]; then
            universal_args+=(--universal-floor)
          fi
          python3 tools/android_build.py --abi "$ABI" --public --profile release "${universal_args[@]}" \
            --app-id "$app_id" --sdk "$ANDROID_HOME" \
            --java-home "${JAVA_HOME_17_X64:-$JAVA_HOME}" --gradle "$(command -v gradle)" \
            --ndk-version 28.2.13676358 --build-tools-version 35.0.0 \
            --dev-build "${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:12}" \
            --dev-version-code "$((1000 + GITHUB_RUN_NUMBER))"
      - name: Collect APK and checksums
        env:
          ABI: ${{ matrix.abi }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          out = Path('dist'); out.mkdir(exist_ok=True)
          abi, commit = os.environ['ABI'], os.environ['GITHUB_SHA']
          name = f'Nivora-Launcher-{os.environ["GITHUB_RUN_NUMBER"]}-{commit[:12]}-{abi}.apk'
          apk = out / name
          shutil.copyfile(Path('.local/android/apk') / abi / 'horizon-android-public.apk', apk)
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          (out / 'SHA256SUMS.txt').write_text(f'{digest}  {name}\n')
          for source in ('LICENSE', 'THIRD_PARTY_NOTICES.md'):
              shutil.copyfile(source, out / source)
          metadata = {'commit': commit, 'abi': abi,
                      'package': 'dev.taldoshawn.nivora.private' if os.environ.get('NIVORA_PRIVATE_TEST') == '1' else 'dev.taldoshawn.pojav',
                      'private_test': os.environ.get('NIVORA_PRIVATE_TEST') == '1',
                      'signing': 'repository-key' if os.environ.get('HORIZON_ANDROID_KEYSTORE') else 'ephemeral-development',
                      'game_target': '26.3', 'legacy_1_8_gameplay': False,
                      'device_tested': False, 'sha256': digest,
                      'run': f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'}
          (out / 'BUILD.json').write_text(json.dumps(metadata, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'## APK {abi}\n\nDownload the artifact and extract `{name}`.\n\n'
                            f'Source: `{commit}`. Game target: 26.3. Protocol 47 is integrated but experimental; check the separate Android gameplay test.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pojav-rust-${{ github.run_number }}-${{ matrix.abi }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Retain completed compiler work even if a later build step failed
        if: always() && !cancelled() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/ci-target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Remove signing files
        if: always()
        run: rm -f .local/android/ci.keystore .local/android/debug.keystore

  universal:
    if: >-
      always() && (
        (github.event_name == 'workflow_dispatch' && inputs.universal) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/codex/private-hud-peripherals')
      ) && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.universal_source_run_id != ''))
    needs: build
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download the four APKs of this exact run
        env:
          GH_TOKEN: ${{ github.token }}
          REUSED_RUN_ID: ${{ inputs.universal_source_run_id }}
        run: |
          source_run="${REUSED_RUN_ID:-$GITHUB_RUN_ID}"
          [[ "$source_run" =~ ^[0-9]+$ ]]
          if [[ -n "$REUSED_RUN_ID" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run" > source-run.json
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run/jobs?per_page=100" > source-jobs.json
            python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          run = json.loads(Path('source-run.json').read_text())
          assert run['repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['path'] == '.github/workflows/android-apk.yml'
          assert run['status'] == 'completed'
          jobs = json.loads(Path('source-jobs.json').read_text())['jobs']
          expected = {f'build ({abi})' for abi in ('arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64')}
          assert {j['name'] for j in jobs if j['conclusion'] == 'success'} >= expected
          commit = run['head_sha']
          assert len(commit) == 40 and all(c in '0123456789abcdef' for c in commit)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'APK_SOURCE_COMMIT={commit}\n')
          PYCODE
          fi
          gh run download "$source_run" --repo "$GITHUB_REPOSITORY" --pattern 'pojav-rust-*' --dir artifacts
      - name: Install pinned Android signing and alignment tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "build-tools;35.0.0"'
      - name: Assemble, align, sign and audit universal APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from android_universal import assemble
          from check_android_release import audit
          sources = sorted(Path('artifacts').rglob('*.apk'))
          for source in sources:
              m = json.loads((source.parent / 'BUILD.json').read_text())
              assert m['commit'] == os.environ.get('APK_SOURCE_COMMIT', os.environ['GITHUB_SHA'])
              assert hashlib.sha256(source.read_bytes()).hexdigest() == m['sha256']
          Path('dist').mkdir()
          assemble(sources, Path('universal-unsigned.apk'))
          tools = Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0'
          subprocess.run([str(tools/'zipalign'), '-P', '16', '-f', '4', 'universal-unsigned.apk', 'universal-aligned.apk'], check=True)
          key = Path('universal.keystore')
          configured = bool(os.environ.get('KEYSTORE_BASE64'))
          if configured:
              assert os.environ.get('KEYSTORE_PASSWORD') and os.environ.get('KEY_ALIAS')
              key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True)); key.chmod(0o600)
          else:
              os.environ['KEYSTORE_PASSWORD'] = 'android'
              os.environ['KEY_ALIAS'] = 'androiddebugkey'
              subprocess.run(['keytool', '-genkeypair', '-keystore', str(key), '-storepass:env', 'KEYSTORE_PASSWORD', '-keypass:env', 'KEYSTORE_PASSWORD', '-alias', 'androiddebugkey', '-keyalg', 'RSA', '-dname', 'CN=Nivora Development', '-validity', '30'], check=True)
          apk = Path('dist') / f'Nivora-Launcher-{os.environ["GITHUB_RUN_NUMBER"]}-universal.apk'
          try:
              subprocess.run([str(tools/'apksigner'), 'sign', '--ks', str(key), '--ks-key-alias', os.environ['KEY_ALIAS'], '--ks-pass', 'env:KEYSTORE_PASSWORD', '--out', str(apk), 'universal-aligned.apk'], check=True)
          finally:
              key.unlink(missing_ok=True)
          verification = subprocess.check_output([str(tools/'apksigner'), 'verify', '--verbose', '--print-certs', str(apk)], text=True)
          subprocess.run([str(tools/'zipalign'), '-c', '-P', '16', '4', str(apk)], check=True)
          (apk.parent/'signature.txt').write_text(verification)
          report = audit(apk, tools/'aapt2', public=True, app_id='dev.taldoshawn.pojav')
          assert report['passed'], report
          (apk.parent/'audit.json').write_text(json.dumps(report, indent=2))
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          (apk.parent/'SHA256SUMS.txt').write_text(f'{digest}  {apk.name}\n')
          (apk.parent/'BUILD.json').write_text(json.dumps({'commit':os.environ.get('APK_SOURCE_COMMIT', os.environ['GITHUB_SHA']), 'assembly_commit':os.environ['GITHUB_SHA'], 'abi':'universal', 'min_sdk':28, 'bytes':apk.stat().st_size, 'sha256':digest, 'signing':'repository-key' if configured else 'ephemeral-development', 'requires_official_resigning':not configured, 'device_tested':False}, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f'Universal APK: {apk.stat().st_size / 1024**2:.1f} MiB. Android 9+. Contains ARM64, ARMv7, x86 and x86_64. '+('Repository signing key.' if configured else 'Development signature: must be resigned with the official key before use; startup certificate verification remains enabled.'))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nivora-${{ github.run_number }}-universal
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish_alpha9:
    # One-shot release: the exact intentional push message is the publishing gate.
    # Other branch pushes only build artifacts and never publish downloads.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/private-hud-peripherals' &&
      startsWith(github.event.head_commit.message, 'release: NIVORA 0.1.0-alpha.9 Rust-only home') &&
      needs.universal.result == 'success'
    needs: universal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download universal APK from this exact successful build
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "nivora-$GITHUB_RUN_NUMBER-universal" --dir dist
      - name: Verify provenance, signing, checksum and Android package
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'build-tools;35.0.0' >/dev/null
          python3 - <<'PYCODE'
          import hashlib, json, os, zipfile
          from pathlib import Path
          p=Path('dist')
          apk=p/f'Nivora-Launcher-{os.environ["GITHUB_RUN_NUMBER"]}-universal.apk'
          m=json.loads((p/'BUILD.json').read_text())
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          assert m['commit']==os.environ['GITHUB_SHA']
          assert m['assembly_commit']==os.environ['GITHUB_SHA']
          assert m['signing']=='repository-key'
          assert not m['requires_official_resigning']
          assert m['sha256']==digest
          assert 1000+int(os.environ['GITHUB_RUN_NUMBER'])>1047, 'Must upgrade alpha.8'
          audit=json.loads((p/'audit.json').read_text())
          assert audit['passed'] and audit['sha256']==digest
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              assert z.getinfo('resources.arsc').compress_type==zipfile.ZIP_STORED
          m['release_version']='0.1.0-alpha.9'
          m['version_code']=1000+int(os.environ['GITHUB_RUN_NUMBER'])
          (p/'BUILD.json').write_text(json.dumps(m,indent=2)+'\n')
          PYCODE
          (cd dist && sha256sum --check SHA256SUMS.txt)
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 dist/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/*.apk > dist/signature.txt
          grep -Fqi 'Signer #1 certificate SHA-256 digest: 97eff0acd8a9dccf3e1719d239cebdb0916a167838e47ea3b7e2305ca2c60ee7' dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging dist/*.apk > badging.txt
          grep -q "package: name='dev.taldoshawn.pojav'" badging.txt
      - name: Publish experimental universal APK to official GitHub Releases
        run: |
          if gh release view v0.1.0-alpha.9 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'The alpha.9 release already exists. Refusing to overwrite it.'
            exit 1
          fi
          gh release create v0.1.0-alpha.9 \
            dist/*.apk dist/BUILD.json dist/SHA256SUMS.txt dist/signature.txt dist/audit.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Nivora Launcher 0.1.0-alpha.9 — Rust-only home' \
            --notes-file docs/release-alpha9-rust-home.md \
            --prerelease
